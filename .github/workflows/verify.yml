name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-reference-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-11-18
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13.1
          cache: pip
          cache-dependency-path: services/knowledge/requirements.lock
      - name: Install pinned Node dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Create the isolated Python environment
        run: python -m venv services/knowledge/.venv
      - name: Install hash-locked Python wheels
        run: >-
          services/knowledge/.venv/bin/python -m pip install --require-hashes
          --only-binary=:all: -r services/knowledge/requirements.lock
      - name: Verify types, fixtures, database behavior, formatting and build
        run: npm run verify
        # No provider secret, paid request, model download or remote publication is required.
